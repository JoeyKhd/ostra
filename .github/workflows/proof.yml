name: Proof

# The checks CI doesn't run: apps/web's Playwright e2e suite, milestone 6's Linear rehearsal (a load
# check), the failure suite's kill points and schedule hunt on the fakes (F-048), the docs' commands,
# and milestone 5's live jobs on Linux with Docker, on kind and on macOS
# (ticket 35, ADR 0061). It runs once, at the launch gate, with the security review and the load
# test: the lead dispatches it on the maintainer's word (`gh workflow run Proof -f jobs=all`), and
# never while building (the maintainer, 2026-11-21: "they slow things down a lot"). Never on push,
# never on a schedule. The everyday checks are in ci.yml.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs: all, panel (e2e with the Linear rehearsal, the failure cases on the fakes, docs commands) or fleet (the live Docker, kind and macOS jobs)"
        type: choice
        default: all
        options: [all, panel, fleet]

permissions:
  contents: read

jobs:
  # The panel's Playwright suite (apps/web/e2e/): the production build on a throwaway stack, with an
  # embedded Postgres, a fake GitHub, a stub model endpoint, core and a runner on the host executor.
  # Then milestone 6's Linear rehearsal, on the same kind of fakes (about 5 minutes).
  e2e:
    if: inputs.jobs != 'fleet'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Prisma's client, which the panel's build and the rehearsal import.
      - id: generate
        run: pnpm turbo run generate

      # The browsers are cached per Playwright version; the system libraries they need are not.
      - id: playwright
        run: echo "version=$(node -p 'require("./apps/web/node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @ostra/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @ostra/web exec playwright install-deps chromium

      # Next.js's build cache, keyed on the lockfile and the panel's source.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The output also goes to a file, whose end the job summary shows when the suite fails.
      - run: set -o pipefail; pnpm --filter @ostra/web test:e2e 2>&1 | tee e2e.log
      # F-083 (ticket 20): the pseudo-locale pass, on a build of its own (.next-pseudo) in which
      # every message reads ⟦…⟧; any visible text outside the brackets bypassed `t`.
      - run: set -o pipefail; (OSTRA_PSEUDO_LOCALE=1 pnpm --filter @ostra/web exec next build && OSTRA_PSEUDO_LOCALE=1 pnpm --filter @ostra/web exec playwright test -c playwright.pseudo.config.ts) 2>&1 | tee -a e2e.log

      # F-012/c6 (milestone 6's ticket 38): the Linear agent-mode harness's four bullets against core
      # as its own process and the fake Linear, on an embedded Postgres. A load check (50 delegations,
      # each first thought under 10 s after the 200), so it runs here, alone on the machine, and never
      # in ci.yml's `pnpm test`, where it skips itself. It runs whatever the Playwright suite did.
      - if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        env:
          OSTRA_LINEAR_REHEARSAL: "1"
        run: pnpm --filter @ostra/e2e-m6-linear-agent-mode exec vitest run src/rehearsal.test.ts

      - if: failure()
        run: |
          {
            echo '### The end of the e2e output'
            echo '```'
            grep -v '"level":"info"' e2e.log 2>/dev/null | tail -n 150 | cut -c1-400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # F-048/c2 (milestone 2's ticket 38, milestone 6's ticket 37): the failure suite's cases that need
  # only core's own processes and the fakes. Spike 8's three kill points of a job, with two replicas
  # of core on one embedded Postgres and the one holding the job killed before its side effect, after
  # it, and after the job completed, on a fake GitHub that counts the PR creates per head branch and a
  # fake Linear that counts its mutations, then a retry after a write committed (about 3 minutes);
  # then F-106's schedule hunt beside pg-boss's own cron as its control (about 17 minutes). Both skip
  # themselves in ci.yml's `pnpm test`, for their length, and run here.
  failure-cases:
    if: inputs.jobs != 'fleet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: generate
        run: pnpm turbo run generate

      - env:
          OSTRA_FAILURE_SUITE: "1"
        run: set -o pipefail; pnpm --filter @ostra/core exec vitest run src/failure-suite.test.ts 2>&1 | tee failure-cases.log
      # The hunt runs whatever the kill points did.
      - if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        env:
          OSTRA_SCHEDULE_HUNT: "1"
          OSTRA_SCHEDULE_HUNT_LOG: ${{ runner.temp }}/schedule-hunt.log
        run: set -o pipefail; pnpm --filter @ostra/core exec vitest run src/schedule-hunt.test.ts 2>&1 | tee -a failure-cases.log

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-cases
          path: |
            failure-cases.log
            ${{ runner.temp }}/schedule-hunt.log
          retention-days: 14
          if-no-files-found: ignore

  # The docs' checked commands (F-058, ticket 22): every `sh` block marked `run` in apps/docs/content,
  # in the navigation's order, on a fresh ubuntu-24.04, stopping at the first that fails. The release
  # candidate's images are built from this commit, and its compose file is this commit's, so the
  # install guide's download link points at deploy/ (`--release-assets`). No secret.
  docs-commands:
    if: inputs.jobs != 'fleet'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The release candidate: the server, runner and base images the compose file names.
      - run: docker compose -f deploy/compose.yaml --profile images build

      - run: set -o pipefail; node scripts/check-docs-commands.ts --cwd "$RUNNER_TEMP/docs-commands" --release-assets "file://$GITHUB_WORKSPACE/deploy/" 2>&1 | tee docs-commands.log

      - if: always()
        run: |
          cd "$RUNNER_TEMP/docs-commands/ostra" 2>/dev/null && docker compose ps -a && docker compose logs --no-color > "$GITHUB_WORKSPACE/docs-commands-stack.log" 2>&1 || true

      # F-076 (ticket 22): milestone 1's setup specs on a fresh `docker compose up` of the same
      # compose file and images, with the fake GitHub and the stub model (apps/web/e2e/compose-e2e.sh).
      - run: pnpm turbo run generate
      - run: pnpm --filter @ostra/web exec playwright install --with-deps chromium
      - run: set -o pipefail; bash apps/web/e2e/compose-e2e.sh "$RUNNER_TEMP/docs-commands/ostra" 2>&1 | tee compose-e2e.log

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-commands
          path: |
            docs-commands.log
            docs-commands-stack.log
            compose-e2e.log
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Milestone 5's live proofs (ticket 35, ADR 0061): each job runs its script in scripts/live/ (the
  # same steps run on anyone's own machine), with stub models, the fake git upstream and no secret.
  # Every tool the scripts install is pinned by version and SHA-256, every image by digest. Each step
  # ends in a RESULT line; a step a hosted runner can't do says why, and its feature stays
  # `building`. The logs are checked for anything secret-like before they're uploaded as the run's
  # artifacts.
  live-docker:
    if: inputs.jobs != 'panel'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LIVE_OUT: ${{ github.workspace }}/live-logs/docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run generate
      - run: bash scripts/live/docker.sh
      - if: always()
        run: grep '^RESULT' "$LIVE_OUT/results.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - id: check
        if: always()
        run: bash scripts/live/check-logs.sh "$LIVE_OUT"
      - if: always() && steps.check.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-docker
          path: live-logs/docker/
          retention-days: 30

  live-kind:
    if: inputs.jobs != 'panel'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIVE_OUT: ${{ github.workspace }}/live-logs/kind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run generate
      - run: bash scripts/live/kind.sh
      - if: always()
        run: grep '^RESULT' "$LIVE_OUT/results.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - id: check
        if: always()
        run: bash scripts/live/check-logs.sh "$LIVE_OUT"
      - if: always() && steps.check.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-kind
          path: live-logs/kind/
          retention-days: 30

  live-macos:
    if: inputs.jobs != 'panel'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LIVE_OUT: ${{ github.workspace }}/live-logs/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/live/macos.sh
      - if: always()
        run: grep '^RESULT' "$LIVE_OUT/results.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - id: check
        if: always()
        run: bash scripts/live/check-logs.sh "$LIVE_OUT"
      - if: always() && steps.check.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-macos
          path: live-logs/macos/
          retention-days: 30
