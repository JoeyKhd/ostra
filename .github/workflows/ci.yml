name: CI

# The checks below run on every push to main and on pull requests. The Playwright e2e suite, the
# Linear rehearsal (a load check, skipped in `pnpm test`), the docs' commands and the live jobs are
# in proof.yml, which runs once, at the launch gate: the maintainer, 2026-11-19 and 2026-11-21.
# Don't add those to this file.
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

# A newer push cancels the run of a branch it replaces, never a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Typecheck and lint take about 7 minutes and the tests about 14 (OpenCode's contract files alone
    # take 12): every run on main from 2026-11-20 13:34 to d3c46c97 was cut off at 15. A slower
    # runner takes 40% longer at every step (run 44894759712: 9.5 minutes for typecheck and lint,
    # and the tests still going at 20, with every file that had finished green), so 30 cut that too.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:licenses
