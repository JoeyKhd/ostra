name: CI

# The maintainer, 2026-11-19: no run on every push to main. CI runs on pull requests, once a night
# on main, and by hand (gh workflow run CI, or the Actions tab). Agents prove their work locally
# before they push (AGENTS.md); don't add a push trigger back.
on:
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

# A newer push cancels the run of a branch it replaces, never a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:licenses
