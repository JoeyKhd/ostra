# spikes/ is not a workspace member: each spike has its own workspace file (docs/development.md).
packages:
  - apps/*
  - packages/*
  - packages/adapters/*
  - e2e/*
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.13"
  - "@turbo/darwin-arm64@2.11.13"
  - "@turbo/linux-64@2.11.13"
  - "@turbo/linux-arm64@2.11.13"
  - "@turbo/windows-64@2.11.13"
  - "@turbo/windows-arm64@2.11.13"
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - turbo@2.11.13
  - vitest@5.1.1
  - '@opencode/cli-darwin-arm64@2.3.2'
  - '@opencode/cli-darwin-x64-baseline@2.3.2'
  - '@opencode/cli-darwin-x64@2.3.2'
  - '@opencode/cli-linux-arm64-musl@2.3.2'
  - '@opencode/cli-linux-arm64@2.3.2'
  - '@opencode/cli-linux-x64-baseline-musl@2.3.2'
  - '@opencode/cli-linux-x64-baseline@2.3.2'
  - '@opencode/cli-linux-x64-musl@2.3.2'
  - '@opencode/cli-linux-x64@2.3.2'
  - '@opencode/cli-windows-arm64@2.3.2'
  - '@opencode/cli-windows-x64-baseline@2.3.2'
  - '@opencode/cli-windows-x64@2.3.2'
  - '@opencode/cli@2.3.2'

# Install scripts we allow: embedded-postgres's platform binaries (a dev dependency of packages/db,
# ADR 0007) and Prisma's engines download.
allowBuilds:
  # The OpenCode agent: its postinstall is never run. The adapter resolves the platform binary
  # itself and checks its SHA-256 (ticket 11).
  "@opencode/cli": false
  # koffi, the host executor's Windows job object (ADR 0007, Q126): its install script would build
  # from source, and its prebuilt `@koromix/koffi-<platform>` package is enough.
  koffi: false
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@prisma/engines": true
  prisma: true
