  <text class="b" x="484" y="540">Responsive: works on a phone</text>

  <text class="bs" x="964" y="576">Rate limits</text>

  <text class="b" x="484" y="704">queue · encrypted secrets · audit log</text>

  <text class="m" x="664" y="1038">automations · tasks (from tickets or prompts)</text>

  <text class="sm" x="2090" y="358">worktrees, no box · Q44</text>

  <text class="b" x="1562" y="546">base image · checkout · dependencies installed · never secrets</text>
