  <!-- Title and legend -->
  <text class="h1" x="40" y="72">ostra · system overview</text>
  <text class="lead" x="40" y="108">Self-hosted cloud agents for your organization: one server, any number of runners, any model.</text>
  <rect x="1640" y="52" width="26" height="18" rx="4" class="box"/><text class="sm" x="1676" y="66">Decided</text>
  <rect x="1770" y="52" width="26" height="18" rx="4" class="pend"/><text class="sm" x="1806" y="66">Needs you, or still open (Q…)</text>
  <rect x="2060" y="52" width="26" height="18" rx="4" class="later"/><text class="sm" x="2096" y="66">After v1</text>
  <text class="sm" x="1640" y="104">Numbers on arrows are the steps in "The life of a task" at the bottom.</text>

  <text class="b" x="84" y="284">The panel in the browser</text>
  <text class="b" x="84" y="310">Phone: approve, answer, reopen</text>
  <text class="b" x="84" y="336">Steer and review any task</text>
  <rect class="box" x="64" y="380" width="312" height="120" rx="10"/>
  <text class="h3" x="84" y="414">Admins</text>
  <text class="b" x="84" y="444">Projects, runner pools, models</text>
  <text class="b" x="84" y="470">Roles, budgets, audit log</text>

  <text class="m" x="84" y="586">ostra runner</text>
  <text class="m" x="84" y="612">ostra login</text>
  <text class="m" x="84" y="638">ostra checkout &lt;task&gt;</text>
  <text class="sm" x="84" y="664">run a runner · edit a task by hand</text>
  <rect class="box" x="64" y="700" width="312" height="130" rx="10"/>
  <text class="h3" x="84" y="734">Anyone in Linear</text>

  <rect class="box" x="64" y="850" width="312" height="160" rx="10"/>
  <text class="h3" x="84" y="884">GitHub reviewers</text>
  <text class="b" x="84" y="914">Review the PR as usual</text>
  <text class="m" x="84" y="942">@ostra &lt;prompt&gt;</text>
  <text class="sm" x="84" y="966">reopens the task from the PR,</text>
  <text class="sm" x="84" y="988">and so does "changes requested"</text>

  <!-- Column B: the server -->
  <rect class="panel" x="440" y="150" width="980" height="930" rx="14"/>
  <text class="h2" x="464" y="196">ostra server</text>
  <text class="sm" x="640" y="196">one image: web, core or all · any number of replicas · on your machines</text>

  <rect class="box" x="464" y="220" width="440" height="300" rx="10"/>
  <text class="h3" x="484" y="254">web · the panel</text>
  <text class="sm" x="484" y="278">Next.js 16 · shadcn/ui · tRPC</text>
  <text class="b" x="484" y="312">Home, projects, inbox, fleet</text>
  <text class="b" x="484" y="338">Task page: AI SDK message types,</text>
  <text class="b" x="484" y="362">rendered with assistant-ui · Q50</text>
  <text class="b" x="484" y="394">Live stream: one per tab, over SSE</text>
  <text class="b" x="484" y="426">better-auth: organizations,</text>
  <text class="b" x="484" y="450">username or email and a password</text>
  <text class="b" x="484" y="490">Responsive: works on a phone</text>

  <rect class="box" x="944" y="220" width="452" height="580" rx="10"/>
  <text class="h3" x="964" y="254">core</text>
  <text class="sm" x="964" y="278">Node · TypeScript · runs beside the panel</text>
  <text class="bs" x="964" y="310">Runner gateway</text>
  <text class="b" x="964" y="334">WebSocket, HTTP fallback · commands · leases</text>
  <text class="bs" x="964" y="366">Webhook inbox</text>
  <text class="b" x="964" y="390">per connection · verified · no duplicates</text>
  <text class="bs" x="964" y="422">Background work</text>
  <text class="b" x="964" y="446">pg-boss: queue, retries, timers, schedules</text>
  <text class="bs" x="964" y="478">Scheduler</text>
  <text class="b" x="964" y="502">a pool by labels and capacity · cap per project</text>
  <text class="bs" x="964" y="534">Credentials and budgets</text>
  <text class="b" x="964" y="558">App tokens (1 h) · provider tokens · secrets</text>
  <text class="b" x="964" y="582">go to a task's sidecar, never its agent</text>
  <rect class="box2" x="964" y="600" width="412" height="186" rx="8"/>
  <text class="bs" x="980" y="626">Adapters · eight kinds, one base class each</text>
  <rect class="chip" x="980" y="640" width="80" height="30" rx="6"/><text class="chip-t" x="1020" y="660" text-anchor="middle">Tracker</text>
  <rect class="chip" x="1068" y="640" width="96" height="30" rx="6"/><text class="chip-t" x="1116" y="660" text-anchor="middle">Code host</text>
  <rect class="chip" x="1172" y="640" width="64" height="30" rx="6"/><text class="chip-t" x="1204" y="660" text-anchor="middle">Agent</text>
  <rect class="chip" x="1244" y="640" width="88" height="30" rx="6"/><text class="chip-t" x="1288" y="660" text-anchor="middle">Executor</text>
  <rect class="chip" x="980" y="678" width="124" height="30" rx="6"/><text class="chip-t" x="1042" y="698" text-anchor="middle">Model provider</text>
  <rect class="chip" x="1112" y="678" width="108" height="30" rx="6"/><text class="chip-t" x="1166" y="698" text-anchor="middle">Notification</text>
  <rect class="chip" x="1228" y="678" width="104" height="30" rx="6"/><text class="chip-t" x="1280" y="698" text-anchor="middle">Secret store</text>
  <rect class="chip" x="980" y="716" width="96" height="30" rx="6"/><text class="chip-t" x="1028" y="736" text-anchor="middle">Blob store</text>
  <text class="sm" x="980" y="772">official SDKs inside: @linear/sdk, Octokit, …</text>

  <rect class="box" x="464" y="540" width="440" height="260" rx="10"/>
  <text class="h3" x="484" y="574">Postgres · the only store needed</text>
  <text class="b" x="484" y="606">organizations · projects · tasks</text>
  <text class="b" x="484" y="632">event log: saved, then acted on</text>
  <text class="b" x="484" y="658">pg-boss queue · secrets · audit log</text>
  <rect class="box2" x="484" y="676" width="400" height="108" rx="8"/>
  <text class="bs" x="500" y="702">Blob store</text>
  <text class="b15" x="500" y="726">files and session archives</text>
  <text class="b15" x="500" y="750">kept in Postgres by default</text>
  <text class="sm" x="500" y="772">any S3-compatible store as an option · Q76</text>

  <rect class="box" x="464" y="820" width="932" height="240" rx="10"/>
  <text class="h3" x="484" y="854">What an organization holds</text>
  <rect class="pend" x="1100" y="834" width="276" height="28" rx="6"/>
  <text class="sm amb" x="1114" y="853">memory search: research due · Q91</text>
  <text class="m" x="484" y="890">Organization ─ members · GitHub App · Linear app</text>
  <text class="m" x="484" y="916">├ Model providers ─ base URL + token</text>
  <text class="m" x="484" y="942">├ Runner pools ─ runners with a join token</text>
  <text class="m" x="484" y="968">├ Agent profiles · memory notes · budgets</text>
  <text class="m" x="484" y="994">└ Projects ─ open or restricted</text>
  <text class="m" x="520" y="1020">└ calculator ─ repos · boards · environment</text>
  <text class="m" x="664" y="1046">automations · tasks: refine, code, review</text>
  <text class="bs" x="1100" y="896">A task</text>
  <text class="b15" x="1100" y="920">belongs to one project and may</text>
  <text class="b15" x="1100" y="944">change any of its repos: one</text>
  <text class="b15" x="1100" y="968">branch, one PR per repo · Q29</text>
  <text class="bs" x="1100" y="1000">Access</text>
  <text class="b15" x="1100" y="1024">admin and member, for the</text>
  <text class="b15" x="1100" y="1048">organization and each project</text>

  <!-- Column C: runner pools -->
  <rect class="panel" x="1500" y="150" width="860" height="930" rx="14"/>
  <text class="h2" x="1524" y="196">Runner pools</text>
  <text class="sm" x="1714" y="196">hosted anywhere · each project picks the pools it may use · Q32</text>

  <rect class="box" x="1524" y="220" width="812" height="100" rx="10"/>
  <text class="bs" x="1542" y="250">ostra runner · the same program on every machine</text>
  <text class="b" x="1542" y="276">joins a pool with a join token: shown once, stored hashed, expires · Q48</text>
  <text class="sm" x="1542" y="302">or runs as a member's personal runner, after a device-code sign-in · it creates and removes boxes, nothing more</text>

  <rect class="box" x="1524" y="336" width="262" height="150" rx="10"/>
  <text class="mh" x="1542" y="368">docker</text>
  <text class="b" x="1542" y="396">a box of containers</text>
  <text class="b" x="1542" y="422">on a private network</text>
  <text class="sm" x="1542" y="452">built first · F-017</text>

  <rect class="box" x="1798" y="336" width="262" height="150" rx="10"/>
  <text class="mh" x="1816" y="368">kubernetes</text>
  <text class="b" x="1816" y="396">a box is one pod</text>
  <text class="b" x="1816" y="422">needs a registry</text>
  <text class="sm" x="1816" y="452">Helm chart · F-093, F-118</text>

  <rect class="box" x="2072" y="336" width="264" height="150" rx="10"/>
  <text class="mh" x="2090" y="368">host</text>
  <text class="b" x="2090" y="396">a worktree, no box</text>
  <text class="b" x="2090" y="422">not isolated, no services</text>
  <text class="sm" x="2090" y="452">personal runners, opt-in pools</text>

  <rect class="box" x="1524" y="500" width="812" height="560" rx="12"/>
  <text class="h3" x="1544" y="536">One box = one task's computer</text>
  <text class="sm" x="1544" y="560">never reused · stops after 15 idle minutes · a reopened task starts a fresh box from its archive · Q38, Q42</text>

  <rect class="box2" x="1544" y="576" width="772" height="52" rx="8"/>
  <text class="bs" x="1562" y="608">Snapshot</text>
  <text class="b" x="1652" y="608">base image · the project's repos · dependencies installed · never a secret</text>

  <rect class="box2" x="1544" y="644" width="288" height="290" rx="8"/>
  <text class="bs" x="1562" y="672">Agent's container</text>
  <text class="sm" x="1562" y="694">repos side by side · no credentials</text>
  <text class="b" x="1562" y="728">OpenCode over ACP</text>
  <text class="b15" x="1562" y="752">reads, edits, runs the checks</text>
  <text class="b15" x="1562" y="776">holds only a fake key</text>
  <rect class="later" x="1560" y="794" width="256" height="58" rx="8"/>
  <text class="bs" x="1576" y="818">Claude Code, on keys</text>
  <text class="sm" x="1576" y="840">second agent · after v1 · F-018</text>
  <rect class="later" x="1560" y="866" width="256" height="34" rx="6"/>
  <text class="sm" x="1576" y="888">Codex: after v1 · F-038</text>

  <rect class="box2" x="1880" y="644" width="436" height="290" rx="8"/>
  <text class="bs" x="1896" y="672">ostra sidecar</text>
  <text class="sm" x="1896" y="694">holds the task's keys · a token for this task only</text>
  <rect class="chip" x="1896" y="708" width="196" height="54" rx="8"/>
  <text class="bs" x="1910" y="730">Git proxy</text>
  <text class="sm" x="1910" y="751">only the task's refs</text>
  <rect class="chip" x="2104" y="708" width="196" height="54" rx="8"/>
  <text class="bs" x="2118" y="730">Key proxy</text>
  <text class="sm" x="2118" y="751">counts every call</text>
  <rect class="chip" x="1896" y="772" width="196" height="54" rx="8"/>
  <text class="bs" x="1910" y="794">ACP driver</text>
  <text class="sm" x="1910" y="815">official SDK 2.x</text>
  <rect class="chip" x="2104" y="772" width="196" height="54" rx="8"/>
  <text class="bs" x="2118" y="794">MCP tools</text>
  <text class="sm" x="2118" y="815">drafts, findings, notes</text>
  <rect class="chip" x="1896" y="836" width="196" height="54" rx="8"/>
  <text class="bs" x="1910" y="858">Spool</text>
  <text class="sm" x="1910" y="879">no event lost</text>
  <rect class="chip" x="2104" y="836" width="196" height="54" rx="8"/>
  <text class="bs" x="2118" y="858">Archive</text>
  <text class="sm" x="2118" y="879">after every turn</text>
  <text class="sm" x="1896" y="918">the same ostra binary, in sidecar mode</text>

  <text class="b" x="1652" y="978">a database, a cache, … from the project's environment, beside the agent</text>
  <text class="sm" x="1544" y="1030">docker: one private network · kubernetes: one pod · host: no box, the runner does the sidecar's work</text>

  <rect class="box" x="64" y="1180" width="436" height="130" rx="10"/>
  <text class="h3" x="84" y="1212">Linear</text>
  <rect class="later" x="330" y="1192" width="152" height="30" rx="6"/>

  <text class="b" x="84" y="1240">tickets · statuses · agent sessions</text>
  <text class="b" x="84" y="1266">one Linear app per organization</text>

  <text class="b" x="540" y="1240">repos · PRs · CI · reviews</text>

  <text class="b" x="996" y="1266">context limits, logos</text>
  <text class="sm" x="996" y="1292">fetched daily by the server · a copy ships in each release</text>

  <text class="b" x="1452" y="1240">holds the snapshot images</text>
  <text class="b" x="1452" y="1266">required for a kubernetes pool</text>
  <text class="sm" x="1452" y="1292">optional for docker and host · F-120</text>

  <text class="h3" x="1908" y="1212">Model providers</text>

  <text class="b" x="1908" y="1266">in either API format</text>
  <text class="sm" x="1908" y="1292">reached only through the key proxy</text>
