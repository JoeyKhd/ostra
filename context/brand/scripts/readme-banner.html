<!doctype html>
<!--
  The README banner (B-025). Render at a 1200×520 viewport, device scale 2, with a transparent
  background, to files/readme/banner.png. It wears the panel's graphite tokens
  (apps/web/src/app/globals.css), never Abyss or teal. The product shot is readme-banner-task.html,
  the task screen as the panel draws it now, embedded live. The fonts are the panel's own files.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ostra · README banner</title>
<style>
  @font-face { font-family: 'Plex Sans'; src: url('../../../apps/web/src/fonts/ibm-plex-sans.ttf') format('truetype'); font-weight: 100 700; }
  @font-face { font-family: 'Plex Mono'; src: url('../../../apps/web/src/fonts/ibm-plex-mono.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Manrope'; src: url('../../../apps/web/src/fonts/manrope.ttf') format('truetype'); font-weight: 200 800; }

  /* The panel's dark tokens (globals.css). */
  :root { --bg: #0d0e10; --line: #1f2023; --text: #f2f3f4; --muted: #b4b7bb; --faint: #8b8e93; --green: #4fb286; }
  html, body { margin: 0; background: transparent; }
  .card {
    position: relative; box-sizing: border-box; width: 1200px; height: 520px; overflow: hidden;
    background:
      radial-gradient(820px 460px at 86% 70%, rgba(242, 243, 244, 0.045), transparent 70%),
      radial-gradient(620px 360px at 0% 0%, rgba(242, 243, 244, 0.025), transparent 70%),
      var(--bg);
    font-family: 'Plex Sans', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased;
  }
  .copy { position: absolute; left: 63px; top: 0; bottom: 0; width: 430px; display: flex; flex-direction: column; justify-content: center; }
  .copy img { height: 34px; align-self: flex-start; }
  h1 { font: 800 46px/1.06 Manrope, sans-serif; letter-spacing: -0.025em; margin: 42px 0 18px; }
  p { font-size: 16.5px; line-height: 1.55; color: var(--muted); margin: 0; max-width: 412px; }
  .tags { margin-top: 26px; font: 400 12px 'Plex Mono', monospace; color: var(--faint); white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  .tags i { display: block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(79, 178, 134, 0.15); }
  .window {
    position: absolute; left: 535px; top: 62px; width: 893px; height: 558px; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(242, 243, 244, 0.12); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 6px rgba(242, 243, 244, 0.025);
  }
  .window iframe { width: 1440px; height: 900px; border: 0; transform: scale(0.62); transform-origin: 0 0; display: block; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(to bottom, rgba(13, 14, 16, 0), var(--bg) 92%); pointer-events: none; }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <img src="../files/logo/lockup-horizontal-shell.svg" alt="ostra">
    <h1>Self-hosted<br>cloud agents<br>for your team.</h1>
    <p>Linear tickets and prompts become agent tasks on your own runners, with your own model keys. Your team steps in, steers, and ships reviewed pull requests.</p>
    <div class="tags"><i></i>source-available · self-hosted · your runners · your keys</div>
  </div>
  <div class="window"><iframe src="readme-banner-task.html" title="ostra task screen" scrolling="no"></iframe></div>
  <div class="fade"></div>
</div>
</body>
</html>
