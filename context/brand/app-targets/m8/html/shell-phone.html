<!doctype html>
<!-- Target: the double-sidebar shell at phone width (app-shell.md, "Phone"), 390×844 screens on one board.
     No bottom tab bar (the maintainer, 2026-11-21): a top bar with the menu button, the breadcrumb and the
     page's action; the menu button opens one sheet holding the rail and the panel side by side.
       (default)    shell-phone: 1, a project's tasks, the sheet closed; 2, a task (task-preview.md, "Phone").
       ?view=menu   shell-phone-menu: the open sheet, dark on the left and light on the right.
     Not a device mockup: the screens only, straight on. Demo data. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>ostra · m8 · shell · phone</title>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="m8.css">
<style>
  body { background: var(--side); }
  .board { position: relative; width: 1440px; height: 956px; }
  .half { position: absolute; top: 0; bottom: 0; width: 720px; background: var(--side); color: var(--text); }
  .lbl { position: absolute; top: 30px; font: 500 13px var(--sans); color: var(--faint); white-space: nowrap; }
  .lbl b { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .ph { position: absolute; top: 60px; width: 390px; height: 844px; background: var(--bg); color: var(--text); border: 1px solid var(--line-2); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; }

  /* The top bar: the menu button, the breadcrumb or title, the page's one action. */
  .ph .top { height: 54px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--line); }
  .ph .top .ib { width: 44px; height: 44px; color: var(--muted); position: relative; }
  .ph .top .ib svg.lucide { width: 20px; height: 20px; }
  .ph .top .menu-dot { position: absolute; top: 10px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 2px var(--bg); }
  [data-theme="light"] .ph .top .menu-dot { box-shadow: 0 0 0 2px var(--bg), inset 0 0 0 1px rgba(138, 83, 0, 0.55); }
  .ph .top .crumb { display: flex; align-items: center; gap: 6px; min-width: 0; font: 500 16px var(--sans); color: var(--muted); white-space: nowrap; }
  .ph .top .crumb .chev { width: 15px; height: 15px; color: var(--faint); }
  .ph .top .crumb b { color: var(--text); font-weight: 600; }
  .ph .top .t2 { display: flex; flex-direction: column; min-width: 0; }
  .ph .top .t2 .a { font: 600 15px/20px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph .top .t2 .b { font: 400 12px/16px var(--mono); color: var(--faint); white-space: nowrap; }
  .ph .top .r { margin-left: auto; display: flex; }

  /* The page: a project's task list (m1/project.md), one column. */
  .ph .scroll { flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px; }
  .ph h1 { font-size: 23px; margin: 0 0 2px; }
  .ph .lede { font-size: 14px; }
  .ph .band { margin-top: 14px; height: 36px; }
  .ph .band svg.lucide { width: 14px; height: 14px; color: var(--muted); }
  .prow { display: grid; grid-template-columns: 16px 1fr auto; column-gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .prow .m { margin-top: 7px; }
  .prow .ti { font: 500 15px/21px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .dd { grid-column: 2 / 4; font: 400 12.5px/18px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .dd .s { font-family: var(--sans); font-size: 13px; color: var(--muted); }
  .prow .dd .c { color: var(--muted); }
  .prow .dd .amber-t { font-family: var(--sans); font-weight: 500; font-size: 13px; }
  .prow .ag { font: 400 12.5px/21px var(--mono); color: var(--faint); }

  /* The sheet: the rail and the panel side by side, the screen less 56px, over the scrim. */
  .shade { position: absolute; inset: 0; background: var(--scrim); }
  .sheet { position: absolute; top: 0; bottom: 0; left: 0; width: 334px; display: flex; background: var(--bg); border-right: 1px solid var(--line-2); box-shadow: var(--shadow-pop); }
  .sheet .rail { padding: 5px 0 10px; height: 100%; }
  .sheet .rail .org { width: 44px; height: 44px; }
  .sheet .rail .org .mono-chip { right: 2px; bottom: 2px; }
  .sheet .rail .tool { width: 44px; height: 44px; border-radius: 8px; }
  .sheet .rail .tool.new { width: 36px; height: 36px; margin: 4px 0; border-radius: 8px; }
  .sheet .rail .rule { margin: 7px 0 7px; }
  .sheet .rail .space { height: 52px; }
  .sheet .rail .foot { gap: 2px; }
  .sheet .rail .me { width: 30px; height: 30px; margin: 7px 0; font-size: 11.5px; }
  .sheet .ctx { flex: 1; width: auto; border-right: 0; }
  .sheet .ctx .resize { display: none; }
  .sheet .ctx .head { height: 54px; padding: 0 4px 0 14px; }
  .sheet .ctx .head h2 { font-size: 16px; }
  .sheet .ctx .head .switch svg.lucide { width: 15px; height: 15px; }
  .sheet .ctx .head .acts .ib { width: 44px; height: 44px; color: var(--muted); }
  .sheet .ctx .head .acts .ib svg.lucide { width: 19px; height: 19px; }
  .sheet .ctx .body { padding: 2px 8px 12px; }
  .sheet .nav { height: 44px; font-size: 15px; gap: 12px; padding: 0 10px; }
  .sheet .nav svg.lucide { width: 18px; height: 18px; }
  .sheet .nav .n { font-size: 12.5px; }
  .sheet .nav .count { height: 20px; min-width: 20px; font-size: 11.5px; border-radius: 10px; }
  .sheet .sec { padding: 16px 10px 4px; font-size: 12.5px; }
  .sheet .sec .r svg.lucide { width: 16px; height: 16px; }
  .sheet .live { grid-template-columns: 14px 1fr; column-gap: 10px; padding: 7px 10px; }
  .sheet .live .st { margin-top: 8px; }
  .sheet .live .t { font-size: 15px; line-height: 21px; }
  .sheet .live .d { font-size: 12.5px; line-height: 18px; }

  /* The task (task-preview.md, "Phone") */
  .segw { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .segw .seg { display: flex; width: 100%; }
  .segw .seg > span { flex: 1; justify-content: center; height: 36px; font-size: 14px; }
  .ptb { height: 50px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .ptb .svc { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); font: 400 13.5px var(--mono); }
  .ptb .svc svg.lucide { width: 14px; height: 14px; color: var(--faint); }
  .ptb .path { flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); font: 400 13.5px var(--mono); }
  .ptb .ib { width: 40px; height: 40px; color: var(--muted); }
  .ptb .ib svg.lucide { width: 18px; height: 18px; }
  .pview { flex: 1; min-height: 0; background: var(--surface); padding: 8px; }
  .pview .frame { width: 100%; height: 100%; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
  .pfoot { height: 30px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
  .pfoot .mono { font-size: 12px; color: var(--faint); margin-left: auto; }
  .dock { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px 14px; border-top: 1px solid var(--line); background: var(--bg); }
  .dock .in { flex: 1; height: 44px; display: flex; align-items: center; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); color: var(--faint); font-size: 15px; }
  .dock .send { width: 44px; height: 44px; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
</style>
</head>
<body data-space="projects" data-panel="project" data-active="tasks">
<div class="board" id="board"></div>
<script src="app-fixture.js"></script>
<script>
  // Builds the board before shell.js runs, so shell.js fills every rail and panel it finds.
  (() => {
    const view = new URLSearchParams(location.search).get("view");
    const menuButton = '<span class="ib" title="Open navigation, 5 need you"><i data-lucide="menu"></i><span class="menu-dot"></span></span>';

    // The project's task list, as the sheet leaves it.
    const projectPage = () => `
      <div class="top">${menuButton}<span class="crumb"><span>calculator</span><i data-lucide="chevron-right" class="chev"></i><b>Tasks</b></span><span class="r"><span class="ib" title="New task in calculator"><i data-lucide="plus"></i></span></span></div>
      <div class="scroll">
        <h1>calculator</h1>
        <p class="lede"><span class="mono" style="font-size:13px;color:var(--text)">acme/calculator-web</span> · 2 waiting on you</p>
        <div class="band"><span class="dot amber"></span>Needs you <span class="n">2</span></div>
        <div class="prow"><span class="m"><span class="dot amber"></span></span><span class="ti">Keep the last 50 results</span><span class="ag">14m</span><span class="dd">CALC-161 · <span class="amber-t">Approval:</span> <span class="c">pnpm db:migrate</span></span></div>
        <div class="prow"><span class="m"><span class="dot amber"></span></span><span class="ti">Retry webhook delivery on 5xx</span><span class="ag">32m</span><span class="dd">CALC-142 · <span class="amber-t">Question:</span> <span class="s">keep the old retry header?</span></span></div>
        <div class="band"><span class="dot green"></span>Running <span class="n">3</span></div>
        <div class="prow"><span class="m"><span class="dot green"></span></span><span class="ti">Add a history panel</span><span class="ag">12m</span><span class="dd">CALC-192 · <span class="s">Editing</span> <span class="c">panel.tsx</span></span></div>
        <div class="prow"><span class="m"><span class="dot green"></span></span><span class="ti">Fix rounding in percent mode</span><span class="ag">6m</span><span class="dd">CALC-170 · <span class="s">Running</span> <span class="c">pnpm test</span></span></div>
        <div class="prow"><span class="m"><span class="spin"></span></span><span class="ti">Add a short CONTRIBUTING.md</span><span class="ag">1m</span><span class="dd">CALC-177 · <span class="s">Preparing the box</span></span></div>
        <div class="band"><span class="ring"></span>Queued <span class="n">1</span></div>
        <div class="prow"><span class="m"><span class="ring"></span></span><span class="ti">Keyboard shortcuts for memory keys</span><span class="ag">2m</span><span class="dd">CALC-181 · <span class="s">Waiting for a runner</span></span></div>
        <div class="band"><i data-lucide="git-pull-request"></i>In review <span class="n">2</span></div>
        <div class="prow"><span class="m"><i data-lucide="git-pull-request" style="width:13px;height:13px;color:var(--muted);margin-top:-3px"></i></span><span class="ti">Upgrade Prisma to 7.2</span><span class="ag">2h</span><span class="dd">CALC-158 · <span class="s">PR</span> #481</span></div>
        <div class="prow"><span class="m"><i data-lucide="git-pull-request" style="width:13px;height:13px;color:var(--muted);margin-top:-3px"></i></span><span class="ti">Parse locale decimal separators</span><span class="ag">5h</span><span class="dd">CALC-155 · <span class="s">PR</span> #476</span></div>
      </div>`;

    // The open menu: one sheet, the rail beside the open space's panel.
    const sheet = () => `
      <div class="shade"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Navigation">
        <nav class="rail" aria-label="Spaces"></nav>
        <aside class="ctx"></aside>
      </div>`;

    // A task: Chat and Preview, one at a time (task-preview.md, "Phone").
    const taskPage = () => `
      <div class="top">${menuButton}<span class="t2"><span class="a">Add a history panel</span><span class="b">CALC-192 · <span style="color:var(--green)">●</span> Running</span></span><span class="r"><span class="ib" title="More"><i data-lucide="ellipsis"></i></span></span></div>
      <div class="segw"><span class="seg"><span><i data-lucide="messages-square"></i> Chat</span><span class="on"><i data-lucide="app-window"></i> Preview</span></span></div>
      <div class="ptb"><span class="svc"><span class="dot green"></span>web<i data-lucide="chevron-down"></i></span><span class="path">/history</span><span class="ib"><i data-lucide="rotate-cw"></i></span><span class="ib"><i data-lucide="users"></i></span></div>
      <div class="pview"><div class="frame">${tallyApp({ phone: true })}</div></div>
      <div class="pfoot"><span class="dot green"></span>Live <span class="faint">· the box's browser</span><span class="mono">372 × 534</span></div>
      <div class="dock"><span class="in">Message the agent…</span><span class="send"><i data-lucide="arrow-up"></i></span></div>`;

    const board = document.getElementById("board");
    if (view === "menu") {
      board.innerHTML = `
        <div class="half" data-theme="dark" style="left:0">
          <div class="lbl" style="left:165px"><b>1</b>The menu button opens one sheet: the rail and the project's panel</div>
          <div class="ph" style="left:165px">${projectPage()}${sheet()}</div>
        </div>
        <div class="half" data-theme="light" style="left:720px">
          <div class="lbl" style="left:165px"><b>2</b>The same, in light</div>
          <div class="ph" style="left:165px">${projectPage()}${sheet()}</div>
        </div>`;
    } else {
      board.innerHTML = `
        <div class="lbl" style="left:285px"><b>1</b>A project's tasks: the menu, the breadcrumb, the page's action</div>
        <div class="ph" style="left:285px">${projectPage()}</div>
        <div class="lbl" style="left:765px"><b>2</b>A task: Chat and Preview, one at a time</div>
        <div class="ph" style="left:765px">${taskPage()}</div>`;
    }
  })();
</script>
<script src="shell.js"></script>
<script>
  // In the sheet, the panel's head keeps its switcher and gains a 44px close; the page's `plus` is in the top bar.
  for (const acts of document.querySelectorAll(".sheet .ctx .head .acts")) {
    acts.innerHTML = '<span class="ib" title="Close navigation"><i data-lucide="x"></i></span>';
  }
</script>
</body>
</html>
