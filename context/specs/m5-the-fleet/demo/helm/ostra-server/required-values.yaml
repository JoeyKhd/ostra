---
# Source: ostra-server/templates/deployments.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostra-ostra-server-web
  labels:
    app.kubernetes.io/name: ostra-server
    app.kubernetes.io/instance: ostra
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ostra
    helm.sh/chart: ostra-server-0.0.0
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ostra-server
      app.kubernetes.io/instance: ostra
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ostra-server
        app.kubernetes.io/instance: ostra
        app.kubernetes.io/version: "0.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: ostra
        helm.sh/chart: ostra-server-0.0.0
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ostra/server:0.0.0
          imagePullPolicy: IfNotPresent
          args: ["web"]
          ports:
            - name: http
              containerPort: 3000
          env:
            
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ostra-ostra-server-database
                  key: DATABASE_URL
            - name: OSTRA_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: ostra-ostra-server-keys
                  key: OSTRA_SECRETS_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ostra-ostra-server-keys
                  key: BETTER_AUTH_SECRET
            - name: OSTRA_RUNNER_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: ostra-ostra-server-keys
                  key: OSTRA_RUNNER_TOKEN_KEY
            - name: OSTRA_WEB_PORT
              value: "3000"
            - name: OSTRA_CORE_PORT
              value: "8787"
            - name: OSTRA_CORE_INTERNAL_URL
              value: "http://ostra-ostra-server-core:8787"
            - name: OSTRA_DATA_DIR
              value: /var/lib/ostra
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/ostra
      volumes:
        # The keys come from the shared secret; this holds what a process makes for itself.
        - name: data
          emptyDir: {}

