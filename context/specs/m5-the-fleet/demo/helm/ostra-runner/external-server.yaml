# Source: ostra-runner/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostra-ostra-runner
  namespace: ostra
  labels:
    app.kubernetes.io/name: ostra-runner
    app.kubernetes.io/instance: ostra
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ostra
    helm.sh/chart: ostra-runner-0.0.0
spec:
  # One runner per key pair: a second replica would be a second runner on the same data.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ostra-runner
      app.kubernetes.io/instance: ostra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ostra-runner
        app.kubernetes.io/instance: ostra
        app.kubernetes.io/version: "0.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: ostra
        helm.sh/chart: ostra-runner-0.0.0
    spec:
      serviceAccountName: ostra-ostra-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ostra/runner:0.0.0
          imagePullPolicy: IfNotPresent
          args: ["runner", "--executor", "kubernetes"]
          env:
            - name: OSTRA_SERVER_URL
              value: "https://core.ostra.example.com"
            - name: OSTRA_BOX_SERVER_URL
              value: "https://core.ostra.example.com"
            - name: OSTRA_JOIN_TOKEN_FILE
              value: "/var/run/ostra/join-token/token"
            - name: OSTRA_RUNNER_NAME
              value: "gpu-pool-a"
            - name: OSTRA_RUNNER_DATA_DIR
              value: /var/lib/ostra-runner
            - name: OSTRA_RUNNER_SLOTS
              value: "40"
            - name: OSTRA_RUNNER_LABELS
              value: "gpu,region:eu"
            - name: OSTRA_K8S_NAMESPACE
              value: "ostra-boxes"
            - name: OSTRA_K8S_BUILD_NAMESPACE
              value: "ostra-builds"
            - name: OSTRA_K8S_NODE_WAIT_MINUTES
              value: "15"
            - name: OSTRA_K8S_RUNTIME_CLASS
              value: "gvisor"
            - name: OSTRA_EGRESS_ALLOW
              value: "10.20.0.15,10.30.0.0/24"
            - name: OSTRA_BOX_BASE_IMAGE
              value: "ostra/base:0.0.0"
            - name: OSTRA_BOX_RUNNER_IMAGE
              value: "ostra/runner:0.0.0"
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: join-token
              mountPath: /var/run/ostra/join-token
              readOnly: true
            - name: data
              mountPath: /var/lib/ostra-runner
      volumes:
        - name: join-token
          secret:
            secretName: ostra-join-token
            items:
              - key: token
                path: token
        - name: data
          persistentVolumeClaim:
            claimName: ostra-ostra-runner
