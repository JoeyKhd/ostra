# The database URL and the three keys from secrets you made yourself: the chart makes no secret.
#   kubectl create secret generic ostra-database --from-literal=DATABASE_URL=postgres://...
#   kubectl create secret generic ostra-keys --from-literal=OSTRA_SECRETS_KEY=$(openssl rand -base64 32) \
#     --from-literal=BETTER_AUTH_SECRET=$(openssl rand -base64 36) --from-literal=OSTRA_RUNNER_TOKEN_KEY=$(openssl rand -base64 32)
database:
  existingSecret: ostra-database
secrets:
  existingSecret: ostra-keys
