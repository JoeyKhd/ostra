{{- /*
The one secret every server process shares (ADR 0060, Q136): OSTRA_SECRETS_KEY, BETTER_AUTH_SECRET
and OSTRA_RUNNER_TOKEN_KEY. Made once, on install: on upgrade `lookup` reads the values already in
the cluster and keeps them, and Helm never deletes it (losing OSTRA_SECRETS_KEY loses every stored
secret). With secrets.existingSecret the chart makes none and reads that one.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "ostra-server.keysSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := get $existing "data" | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ostra-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  OSTRA_SECRETS_KEY: {{ get $data "OSTRA_SECRETS_KEY" | default (randBytes 32 | b64enc) | quote }}
  BETTER_AUTH_SECRET: {{ get $data "BETTER_AUTH_SECRET" | default (randAlphaNum 48 | b64enc) | quote }}
  OSTRA_RUNNER_TOKEN_KEY: {{ get $data "OSTRA_RUNNER_TOKEN_KEY" | default (randBytes 32 | b64enc) | quote }}
{{- end }}
{{- if .Values.database.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ostra-server.databaseSecret" . }}
  labels:
    {{- include "ostra-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
{{- end }}
