# gVisor as the runtime on Kubernetes (ADR 0031: the docs recommend it; spike 3
# runs every check with it too). The node must have the runsc containerd shim
# installed and a containerd runtime handler named `runsc`. A box pod selects
# this class with OSTRA_RUNTIME_CLASS=gvisor (deploy/k8s/box-pod.yaml).
#
# No `scheduling:` block: that would tie the class to one provider's node
# labels. On GKE Sandbox use runtimeclass.gke.yaml instead.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
